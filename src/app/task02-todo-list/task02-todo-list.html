<div class="container min-vh-100 d-flex flex-column align-items-center py-4 bg-light">

  <!-- Title -->
  <h1 class="fw-bold mb-4 text-dark">Todo List</h1>

  <!-- Input Row -->
  <div class="row w-100 justify-content-center mb-4" style="max-width: 420px;">
    <div class="col-12 col-sm-8 mb-2 mb-sm-0">
      <input
        type="text"
        class="form-control"
        [(ngModel)]="task"
        placeholder="Enter New Task"
        (keyup.enter)="addTask()"
      />
    </div>
    <div class="col-12 col-sm-4">
      <button
        class="btn btn-primary w-100"
        (click)="addTask()"
      >
        Add Task
      </button>
    </div>
  </div>

  <!-- Task List -->
  <ul class="list-unstyled w-100" style="max-width: 420px;">
    @for (task of taskList; track task.id; let i = $index) {
      <li class="card shadow-sm mb-2 border-0">
        <div class="card-body d-flex align-items-center gap-2 p-2">

          <!-- ID Badge -->
          <span class="badge rounded-pill bg-primary-subtle text-primary fw-semibold px-3 py-2">
            {{ i + 1 }}
          </span>

          <!-- Task Text -->
          <span class="flex-grow-1">
            {{ task.task }}
          </span>

          <!-- Delete Button -->
          <button
            class="btn btn-danger btn-sm"
            (click)="deleteTask(task.id)"
          >
            Delete
          </button>

        </div>
      </li>
    }
  </ul>

</div>
