<div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">

  <h1 class="mb-4">{{ appTitle }}</h1>

  <!-- Display Number -->
  <div class="bg-secondary text-white text-center rounded-3 mb-4 d-flex justify-content-center align-items-center"
       style="width: 120px; height: 70px; font-size: 40px;">
    {{ count }}
  </div>

  <!-- Buttons -->
  <div class="d-flex gap-2">
    <button class="btn btn-outline-danger btn-sm"
            (click)="countDecrement()">
      Decrement
    </button>

    <button class="btn btn-outline-secondary btn-sm"
            (click)="countReset()">
      Reset
    </button>

    <button class="btn btn-outline-success btn-sm"
            (click)="countIncrement()">
      Increment
    </button>
  </div>

</div>
